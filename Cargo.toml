[package]
name = "rax"
version = "0.4.1"
edition = "2021"
publish = false

[workspace]
members = [
  "crates/rax-cli",
  "crates/rax-broker",
  "crates/rax-core",
  "crates/rax-docstore",
  "crates/rax-multimodal",
  "crates/rax-ffi",
  "crates/rax-runtime",
  "crates/rax-search",
  "crates/rax-structured-memory",
  "crates/rax-text",
  "crates/rax-vector",
  "crates/rax-bench-artifacts",
  "crates/rax-bench-cli",
  "crates/rax-bench-metrics",
  "crates/rax-bench-model",
  "crates/rax-bench-packer",
  "crates/rax-bench-reducer",
  "crates/rax-bench-runner",
  "crates/rax-bench-text-engine",
]
resolver = "2"

[dev-dependencies]
fs4 = "1.1.0"
serde = "1.0.228"
serde_json = "1.0.145"
sha2 = "0.10.9"
strum = "0.27.2"
tempfile = "3.23.0"
rax-bench-artifacts = { path = "crates/rax-bench-artifacts" }
rax-bench-model = { path = "crates/rax-bench-model" }
rax-bench-metrics = { path = "crates/rax-bench-metrics" }
rax-bench-packer = { path = "crates/rax-bench-packer" }
rax-bench-reducer = { path = "crates/rax-bench-reducer" }
rax-bench-runner = { path = "crates/rax-bench-runner" }
rax-bench-text-engine = { path = "crates/rax-bench-text-engine" }
rax-core = { path = "crates/rax-core" }
rax-docstore = { path = "crates/rax-docstore" }
rax-broker = { path = "crates/rax-broker" }
rax-runtime = { path = "crates/rax-runtime" }
rax-multimodal = { path = "crates/rax-multimodal" }
rax-structured-memory = { path = "crates/rax-structured-memory" }
rax-text = { path = "crates/rax-text" }
rax-vector = { path = "crates/rax-vector" }

