[package]
name = "wax-v2-mcp"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
cap-fs-ext = "4.0.2"
cap-std = "4.0.2"
fs2 = "0.4.3"
libc = "0.2.177"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tempfile = "3.23.0"
wax-v2-broker = { path = "../wax-v2-broker" }
wax-v2-core = { path = "../wax-v2-core" }
wax-v2-runtime = { path = "../wax-v2-runtime" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[[bin]]
name = "wax-mcp"
path = "src/main.rs"

[dev-dependencies]
