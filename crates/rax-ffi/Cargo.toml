[package]
name = "rax-ffi"
version = "0.4.1"
edition = "2021"

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
libc = "0.2.177"
rax-runtime = { path = "../rax-runtime" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

[dev-dependencies]
tempfile = "3.23.0"
